<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 換車財務精算分析系統</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, '微軟正黑體', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            line-height: 1.6;
        }
        .card { 
            background: white; 
            border-radius: 1rem; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
            padding: 2rem; 
            margin-bottom: 2rem; 
        }
        .danger { color: #dc2626; font-weight: bold; }
        .success { color: #16a34a; font-weight: bold; }
        input[type="range"] { accent-color: #2563eb; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const formatCurrency = (num) => {
            return new Intl.NumberFormat('zh-TW', { 
                style: 'currency', 
                currency: 'TWD', 
                minimumFractionDigits: 0, 
                maximumFractionDigits: 0 
            }).format(num);
        };

        const usePersistentState = (key, initialValue) => {
            const [state, setState] = useState(() => {
                const saved = localStorage.getItem(key);
                return saved !== null ? JSON.parse(saved) : initialValue;
            });
            useEffect(() => {
                localStorage.setItem(key, JSON.stringify(state));
            }, [key, state]);
            return [state, setState];
        };

        const App = () => {
            const [crvSellPrice, setCrvSellPrice] = usePersistentState('crvSellPrice', 800000); 
            const [caviraPrice, setCaviraPrice] = usePersistentState('caviraPrice', 1267500); 
            const [totalLoanAmount, setTotalLoanAmount] = usePersistentState('totalLoanAmount', 1400000); 
            const [loanRate, setLoanRate] = usePersistentState('loanRate', 3.55); 
            const [annualMileage, setAnnualMileage] = usePersistentState('annualMileage', 45000); 
            
            const [investTarget, setInvestTarget] = usePersistentState('investTarget', '006208');
            const [investmentRate, setInvestmentRate] = usePersistentState('investmentRate', 8.0); 
            const [dcaMonths, setDcaMonths] = usePersistentState('dcaMonths', 24); 

            const [fuelPrice, setFuelPrice] = usePersistentState('fuelPrice', '31.0'); 
            const [elecPrice, setElecPrice] = usePersistentState('elecPrice', '2.06'); 
            const [crvFuelEconomy, setCrvFuelEconomy] = usePersistentState('crvFuelEconomy', '13.5'); 
            const [caviraEfficiency, setCaviraEfficiency] = usePersistentState('caviraEfficiency', '6.0'); 
            const [chargerInstallCost, setChargerInstallCost] = usePersistentState('chargerInstallCost', '50000'); 
            
            const [evTireCost, setEvTireCost] = usePersistentState('evTireCost', '14000'); 
            const [evTireLifespan, setEvTireLifespan] = usePersistentState('evTireLifespan', '40000'); 
            
            const [fundingPlan, setFundingPlan] = usePersistentState('fundingPlan', 'A');

            const handleInvestTargetChange = (e) => {
                const target = e.target.value;
                setInvestTarget(target);
                if (target === '0050' || target === '006208') {
                    setInvestmentRate(8.0); 
                } else if (target === '00713') {
                    setInvestmentRate(6.5); 
                } else if (target === '00878') {
                    setInvestmentRate(7.0); 
                }
            };

            const resetToDefault = () => {
                if(window.confirm('確定要還原所有參數到預設值嗎？')) {
                    localStorage.clear();
                    window.location.reload();
                }
            };

            const actualLoanAmount = useMemo(() => {
                if (fundingPlan === 'A') return totalLoanAmount;
                const totalSetup = caviraPrice + (Number(chargerInstallCost) || 0) + 38000;
                return Math.max(0, totalSetup - crvSellPrice);
            }, [fundingPlan, totalLoanAmount, caviraPrice, chargerInstallCost, crvSellPrice]);

            const actualInvestAmount = useMemo(() => {
                return fundingPlan === 'A' ? crvSellPrice : 0;
            }, [fundingPlan, crvSellPrice]);

            const fixedPlanBLoanAmount = useMemo(() => {
                const totalSetup = caviraPrice + (Number(chargerInstallCost) || 0) + 38000;
                return Math.max(0, totalSetup - crvSellPrice);
            }, [caviraPrice, chargerInstallCost, crvSellPrice]);

            const crvDetails = useMemo(() => {
                const fe = Number(crvFuelEconomy) || 1; 
                const fuel = (annualMileage / fe) * (Number(fuelPrice) || 0);
                const tax = 11920; 
                const maint = 20000 + (annualMileage / 20000) * 8000; 
                const tires = (annualMileage / 40000) * 16000; 
                const insurance = 12000; 
                
                const cashFlow = fuel + tax + maint + tires + insurance;
                return { fuel, tax, maint, tires, insurance, cashFlow, totalCost: cashFlow };
            }, [annualMileage, fuelPrice, crvFuelEconomy]);

            const caviraDetails = useMemo(() => {
                const eff = Number(caviraEfficiency) || 1; 
                const elec = (annualMileage / eff) * (Number(elecPrice) || 0);
                const tax = 5615; 
                const maint = 5000 + (annualMileage / 20000) * 1500; 
                
                const tires = (annualMileage / (Number(evTireLifespan) || 1)) * (Number(evTireCost) || 0); 
                const insurance = 38000; 
                
                const loanInterest = actualLoanAmount * (loanRate / 100);
                const chargerYearly = (Number(chargerInstallCost) || 0) / 10; 
                
                const cashFlow = elec + tax + maint + tires + insurance + loanInterest;
                const totalCost = cashFlow + chargerYearly;

                return { elec, tax, maint, tires, insurance, loanInterest, chargerYearly, cashFlow, totalCost };
            }, [annualMileage, elecPrice, caviraEfficiency, chargerInstallCost, actualLoanAmount, loanRate, evTireCost, evTireLifespan]);

            const investmentData = useMemo(() => {
                let data = [];
                let currentVal = actualInvestAmount;
                let loanPrincipal = actualLoanAmount;
                let breakEvenYear = null;

                for (let i = 1; i <= 10; i++) {
                    currentVal = currentVal * (1 + investmentRate / 100);
                    if (currentVal >= loanPrincipal && breakEvenYear === null && fundingPlan === 'A') {
                        breakEvenYear = i;
                    }
                    data.push({
                        year: i,
                        value: Math.round(currentVal),
                        loan: loanPrincipal
                    });
                }
                
                const investmentFinalValue = Math.round(currentVal);
                const netArbitrage = investmentFinalValue - loanPrincipal; 
                const tenYearCarSavings = Math.round((crvDetails.totalCost - caviraDetails.totalCost) * 10); 
                const finalNetWealthIncrease = netArbitrage + tenYearCarSavings; 

                let currentValA = crvSellPrice;
                for (let i = 1; i <= 10; i++) currentValA = currentValA * (1 + investmentRate / 100);
                const baseCaviraCost = caviraDetails.totalCost - caviraDetails.loanInterest; 
                const netWealthA = Math.round(currentValA) - totalLoanAmount + Math.round((crvDetails.totalCost - (baseCaviraCost + totalLoanAmount * (loanRate / 100))) * 10);
                const netWealthB = -fixedPlanBLoanAmount + Math.round((crvDetails.totalCost - (baseCaviraCost + fixedPlanBLoanAmount * (loanRate / 100))) * 10);

                return { data, breakEvenYear, investmentFinalValue, netArbitrage, tenYearCarSavings, finalNetWealthIncrease, netWealthA, netWealthB };
            }, [actualInvestAmount, investmentRate, actualLoanAmount, fundingPlan, crvDetails.totalCost, caviraDetails.totalCost, crvSellPrice, totalLoanAmount, loanRate, fixedPlanBLoanAmount]);

            const lumpSumVsDcaData = useMemo(() => {
                if (fundingPlan !== 'A') return null;

                let lsInvested = crvSellPrice;
                let dcaCash = crvSellPrice;
                let dcaInvested = 0;
                
                const rateM = investmentRate / 100 / 12;
                const cashRateM = 1.5 / 100 / 12; 
                const monthlyTransfer = crvSellPrice / dcaMonths;

                const yearlyData = [];

                for (let m = 1; m <= 120; m++) {
                    lsInvested = lsInvested * (1 + rateM);
                    if (dcaCash > 0) {
                        let transfer = Math.min(dcaCash, monthlyTransfer);
                        dcaCash -= transfer;
                        dcaInvested += transfer;
                    }
                    dcaCash = dcaCash * (1 + cashRateM);
                    dcaInvested = dcaInvested * (1 + rateM);

                    if (m % 12 === 0) {
                        const dcaTotal = dcaCash + dcaInvested;
                        yearlyData.push({
                            year: m / 12,
                            lsValue: Math.round(lsInvested),
                            dcaValue: Math.round(dcaTotal),
                            diff: Math.round(lsInvested - dcaTotal)
                        });
                    }
                }
                return yearlyData;
            }, [crvSellPrice, investmentRate, dcaMonths, fundingPlan]);

            const monthlyCashFlow = useMemo(() => {
                const crv = crvDetails.cashFlow / 12;
                const caviraBase = (caviraDetails.cashFlow - caviraDetails.loanInterest) / 12; 
                const planA = caviraBase + ((totalLoanAmount * (loanRate / 100)) / 12);
                const planB = caviraBase + ((fixedPlanBLoanAmount * (loanRate / 100)) / 12);
                return { crv, planA, planB };
            }, [crvDetails.cashFlow, caviraDetails, totalLoanAmount, fixedPlanBLoanAmount, loanRate]);

            const sipData = useMemo(() => {
                const savings = monthlyCashFlow.crv - (fundingPlan === 'A' ? monthlyCashFlow.planA : monthlyCashFlow.planB);
                const rate = investmentRate / 100;
                const monthlyRate = rate / 12;
                let data = [];
                
                if (savings > 0 && monthlyRate > 0) {
                    for (let i = 1; i <= 10; i++) {
                        const months = i * 12;
                        const principal = savings * months;
                        const value = savings * ((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate);
                        data.push({
                            year: i,
                            principal: Math.round(principal),
                            value: Math.round(value),
                            interest: Math.round(value - principal)
                        });
                    }
                }
                return { data, finalValue: data.length > 0 ? Math.round(data[9].value) : 0, monthlySavings: Math.round(savings) };
            }, [monthlyCashFlow, fundingPlan, investmentRate]);

            return (
                <div className="max-w-6xl mx-auto p-4 sm:p-8">
                    <header className="mb-10 text-center relative">
                        <button onClick={resetToDefault} className="absolute right-0 top-0 text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded text-gray-600">🔄 還原預設</button>
                        <h1 className="text-4xl sm:text-5xl font-extrabold text-blue-900 mb-4">🚗 AI 換車財務精算儀表板</h1>
                        <p className="text-xl text-gray-600">CR-V 6代 升級 Foxtron CAVIRA Emerge 十年成本解析</p>
                    </header>

                    <div className="mb-8 flex flex-col sm:flex-row justify-center items-center gap-4">
                        <button 
                            onClick={() => setFundingPlan('A')}
                            className={`px-8 py-4 rounded-xl text-xl font-bold transition-all shadow-md ${fundingPlan === 'A' ? 'bg-blue-600 text-white scale-105' : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-300'}`}>
                            方案 A：全額增貸 {formatCurrency(totalLoanAmount)} (套利)
                        </button>
                        <button 
                            onClick={() => setFundingPlan('B')}
                            className={`px-8 py-4 rounded-xl text-xl font-bold transition-all shadow-md ${fundingPlan === 'B' ? 'bg-indigo-600 text-white scale-105' : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-300'}`}>
                            方案 B：僅貸差額 {formatCurrency(fixedPlanBLoanAmount)} (減壓)
                        </button>
                    </div>

                    <div className="card bg-blue-50 border-l-8 border-blue-600">
                        <h2 className="text-3xl mb-6 font-bold">⚙️ 核心參數設定 (隨改隨存)</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-6">
                            <div>
                                <label className="block text-lg mb-2 font-semibold">CR-V 預估賣出價</label>
                                <input type="range" min="600000" max="1000000" step="10000" value={crvSellPrice} onChange={(e) => setCrvSellPrice(Number(e.target.value))} className="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer" />
                                <div className="text-xl mt-1 font-bold text-blue-800">{formatCurrency(crvSellPrice)}</div>
                            </div>
                            <div>
                                <label className="block text-lg mb-2 font-semibold">房貸增貸總金額</label>
                                <input type="range" min="1000000" max="2000000" step="10000" value={totalLoanAmount} onChange={(e) => setTotalLoanAmount(Number(e.target.value))} disabled={fundingPlan === 'B'} className={`w-full h-2 rounded-lg appearance-none cursor-pointer ${fundingPlan === 'B' ? 'bg-gray-200' : 'bg-gray-400'}`} />
                                <div className={`text-xl mt-1 font-bold ${fundingPlan === 'B' ? 'text-gray-400' : 'text-blue-800'}`}>
                                    {fundingPlan === 'A' ? formatCurrency(totalLoanAmount) : <span className="text-sm">方案B依差額自動計算不需調整</span>}
                                </div>
                            </div>
                            <div>
                                <label className="block text-lg mb-2 font-semibold">每年預估里程(KM)</label>
                                <input type="range" min="10000" max="60000" step="1000" value={annualMileage} onChange={(e) => setAnnualMileage(Number(e.target.value))} className="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer" />
                                <div className="text-xl mt-1 font-bold text-blue-800">{annualMileage.toLocaleString()} KM</div>
                            </div>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-4 pt-4 border-t border-blue-200">
                            <div>
                                <label className="block text-sm text-gray-500 font-bold mb-1">CR-V油耗(km/L)</label>
                                <input type="text" inputMode="decimal" value={crvFuelEconomy} onChange={(e) => setCrvFuelEconomy(e.target.value)} className="w-full p-2 border rounded text-lg font-bold text-gray-700" />
                            </div>
                            <div>
                                <label className="block text-sm text-gray-500 font-bold mb-1">電車電耗(km/度)</label>
                                <input type="text" inputMode="decimal" value={caviraEfficiency} onChange={(e) => setCaviraEfficiency(e.target.value)} className="w-full p-2 border rounded text-lg font-bold text-gray-700" />
                            </div>
                            <div>
                                <label className="block text-sm text-gray-500 font-bold mb-1">95汽油單價</label>
                                <input type="text" inputMode="decimal" value={fuelPrice} onChange={(e) => setFuelPrice(e.target.value)} className="w-full p-2 border rounded text-lg font-bold text-gray-700" />
                            </div>
                            <div>
                                <label className="block text-sm text-gray-500 font-bold mb-1">離峰電價(二段式)</label>
                                <input type="text" inputMode="decimal" value={elecPrice} onChange={(e) => setElecPrice(e.target.value)} className="w-full p-2 border rounded text-lg font-bold text-gray-700" />
                            </div>
                            <div>
                                <label className="block text-sm text-gray-500 font-bold mb-1">充電設備與拉電費</label>
                                <input type="text" inputMode="numeric" value={chargerInstallCost} onChange={(e) => setChargerInstallCost(e.target.value)} className="w-full p-2 border rounded text-lg font-bold text-gray-700" />
                            </div>
                            <div>
                                <label className="block text-sm text-gray-500 font-bold mb-1">225/55 R18 胎費(套)</label>
                                <input type="text" inputMode="numeric" value={evTireCost} onChange={(e) => setEvTireCost(e.target.value)} className="w-full p-2 border rounded text-lg font-bold text-gray-700 bg-yellow-50" title="瑪吉斯等高CP值電胎" />
                            </div>
                            <div>
                                <label className="block text-sm text-gray-500 font-bold mb-1">電車胎壽命(km)</label>
                                <input type="text" inputMode="numeric" value={evTireLifespan} onChange={(e) => setEvTireLifespan(e.target.value)} className="w-full p-2 border rounded text-lg font-bold text-gray-700 bg-yellow-50" />
                            </div>
                        </div>
                    </div>

                    <div className="card">
                        <h2 className="text-3xl mb-6 border-b-2 border-gray-200 pb-2 font-bold">📊 1. 真實持有成本分析 (剔除折舊，開到壞)</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                            <div className="bg-gray-100 p-6 rounded-xl border border-gray-300 relative">
                                <h3 className="text-2xl font-bold mb-4 text-gray-800 border-b pb-2">CR-V (繼續開)</h3>
                                <ul className="text-lg space-y-3 mb-6">
                                    <li className="flex justify-between"><span>每年油錢：</span> <span className="font-mono">{formatCurrency(crvDetails.fuel)}</span></li>
                                    <li className="flex justify-between"><span>稅金：</span> <span className="font-mono">{formatCurrency(crvDetails.tax)}</span></li>
                                    <li className="flex justify-between"><span>保養耗材 (高里程重罰)：</span> <span className="font-mono">{formatCurrency(crvDetails.maint)}</span></li>
                                    <li className="flex justify-between"><span>輪胎磨耗 (依里程)：</span> <span className="font-mono">{formatCurrency(crvDetails.tires)}</span></li>
                                    <li className="flex justify-between"><span>車輛保險 (限額/丙)：</span> <span className="font-mono">{formatCurrency(crvDetails.insurance)}</span></li>
                                    <li className="flex justify-between font-bold border-t border-gray-300 pt-3 text-2xl">
                                        <span>每年現金流支出：</span> <span className="danger">{formatCurrency(crvDetails.totalCost)}</span>
                                    </li>
                                </ul>
                            </div>

                            <div className="bg-green-50 p-6 rounded-xl border border-green-300 relative">
                                <h3 className="text-2xl font-bold mb-4 text-green-800 border-b border-green-200 pb-2">CAVIRA Emerge (換購)</h3>
                                <ul className="text-lg space-y-3 mb-6">
                                    <li className="flex justify-between text-green-700 font-bold"><span>每年電費：</span> <span className="font-mono">{formatCurrency(caviraDetails.elec)}</span></li>
                                    <li className="flex justify-between text-green-700"><span>稅金 (免稅/復徵均攤)：</span> <span className="font-mono">{formatCurrency(caviraDetails.tax)}</span></li>
                                    <li className="flex justify-between text-green-700"><span>保養耗材：</span> <span className="font-mono">{formatCurrency(caviraDetails.maint)}</span></li>
                                    <li className="flex justify-between text-red-600"><span>輪胎耗損攤提：</span> <span className="font-mono">{formatCurrency(caviraDetails.tires)}</span></li>
                                    <li className="flex justify-between text-red-600"><span>車險 (乙式較貴)：</span> <span className="font-mono">{formatCurrency(caviraDetails.insurance)}</span></li>
                                    <li className="flex justify-between text-red-600"><span>房貸增貸利息：</span> <span className="font-mono">{formatCurrency(caviraDetails.loanInterest)}</span></li>
                                    <li className="flex justify-between text-gray-500 text-sm"><span>家充設備10年攤提：</span> <span className="font-mono">{formatCurrency(caviraDetails.chargerYearly)}</span></li>
                                    <li className="flex justify-between font-bold border-t border-green-300 pt-3 text-2xl">
                                        <span>每年總負擔 (含利息)：</span> <span className="success">{formatCurrency(caviraDetails.totalCost)}</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <div className="mt-8 text-2xl bg-yellow-100 p-6 rounded-xl border-l-8 border-yellow-500 shadow-sm leading-relaxed">
                            <strong>💡 財務精算師判讀：</strong><br/>
                            我們已將折舊剔除。結果顯示，即使加入了較貴的電車險、輪胎、房貸利息、充電樁攤提與未來恢復的稅金，由於您<strong>每年超高里程的油費支出</strong>實在太過龐大，換成電車依然能完全 Cover 所有新增成本。<br/>
                            <span className="success mt-2 block">👉 結論：在【{fundingPlan === 'A' ? '方案 A' : '方案 B'}】下，10年實質持有成本為您省下 <strong>{formatCurrency(investmentData.tenYearCarSavings)}</strong>！</span>
                        </div>
                    </div>

                    <div className="card border-4 border-red-200">
                        <h2 className="text-3xl mb-6 border-b-2 border-red-200 pb-2 font-bold flex items-center gap-2">
                            <span>⚠️</span> 終極殘酷壓力測試：逼近 50 萬公里的機械壽命考驗
                        </h2>
                        <div className="text-lg text-gray-700 mb-6 leading-relaxed bg-red-100 p-4 rounded-lg font-bold border border-red-300">
                            🚨 殘酷現實：您現有的 CR-V 已開 7.1 萬公里。若未來 10 年繼續每年開 {annualMileage.toLocaleString()} 公里，您的 CR-V 總里程將突破 <span className="text-red-700 text-2xl">{Math.round(71000 + annualMileage * 10).toLocaleString()} 公里</span>！這已超越一般燃油車設計壽命，將面臨巨大的老化修車潮。
                        </div>

                        <div className="grid md:grid-cols-2 gap-8">
                            <div className="bg-red-50 p-6 rounded-xl border border-red-300">
                                <h3 className="text-xl font-bold text-red-800 mb-3">🛢️ CR-V (1.5T+CVT) 的 52 萬公里挑戰</h3>
                                <p className="mb-4 text-sm text-gray-800">燃油車零組件衰退是線性的，且極度仰賴潤滑。突破 20 萬公里後，「大修費用」將無法避免：</p>
                                <ul className="list-disc pl-5 space-y-2 text-red-900 font-medium">
                                    <li><strong>CVT 變速箱：</strong> 鋼帶與滑輪壽命極限約 20~25 萬 km。52 萬公里生涯恐面臨 1~2 次大修或更換 (預估 6~10 萬/次)。</li>
                                    <li><strong>1.5T 渦輪增壓器：</strong> 長期高溫高壓，約 15~20 萬 km 可能漏油或軸心損壞需更換 (預估 3~5 萬/次)。</li>
                                    <li><strong>老化耗材潮：</strong> 引擎腳、冷氣壓縮機、水泵浦、發電機，幾乎都會經歷一到兩輪的故障汰換。</li>
                                </ul>
                            </div>

                            <div className="bg-blue-50 p-6 rounded-xl border border-blue-300">
                                <h3 className="text-xl font-bold text-blue-800 mb-3">🔋 CAVIRA Emerge 的 45 萬公里挑戰</h3>
                                <p className="mb-4 text-sm text-gray-800">電車沒有複雜的引擎與變速箱，機械大修機率低。最大的風險在於「電池健康度」：</p>
                                <ul className="list-disc pl-5 space-y-2 text-blue-900 font-medium">
